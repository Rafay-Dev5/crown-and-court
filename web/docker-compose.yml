services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ..
      dockerfile: web/Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ..:/app
    working_dir: /app

  client:
    build:
      context: ..
      dockerfile: web/Dockerfile.client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  redis_data:
